[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115,<1",
    "google-genai>=1,<2",
    "httpx>=0.27,<1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yom_awel"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "PyYAML",
    "mypy",
    "ruff",
    "hatchling==1.32.3",
    "pre-commit>=4.6.2",
    "types-openpyxl>=3.1.5.20260827",
    "detect-secrets>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tools/quality"]
markers = ["integration: requires an explicitly configured local Supabase instance"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src/yom_awel"]

[tool.ruff]
line-length = 100
