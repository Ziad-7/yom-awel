[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yom_awel"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "PyYAML",
    "mypy",
    "ruff",
    "hatchling==1.32.3",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../../tools/quality"]

[tool.mypy]
strict = true
files = ["src/yom_awel"]

[tool.ruff]
line-length = 100
