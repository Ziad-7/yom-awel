version: "2"
description: "Claim-to-evidence matrix mapping every public product and pitch claim to tests and artifacts that exist in the repository. Anything not yet verified end to end is marked pending with its reason."

claims:
  - id: "claim-cap-state-machine"
    type: "capability"
    wording: "Learner state transitions follow an explicit, deterministic state machine preventing out-of-order progression."
    usage_locations:
      - "README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
    status: "current"
    owner: "member-2"
    evidence:
      automated_tests:
        - "services/api/tests/domain/test_state_machine.py"
        - "services/api/tests/domain/test_learner_progress.py"
      preview_checks:
        - "Verify learner lifecycle transitions sequentially without skipping states."

  - id: "claim-cap-artifact-upload"
    type: "capability"
    wording: "Learner uploads are ownership-checked and stored locally in local mode or in a dedicated Postgres schema in the hosted demo."
    usage_locations:
      - "README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
    status: "current"
    owner: "member-2"
    evidence:
      automated_tests:
        - "services/api/tests/persistence/test_local_artifacts.py"
        - "services/api/tests/transport/test_multitask_uploads.py"
      preview_checks:
        - "Verify upload authorization is restricted to the learner's own submission prefix."

  - id: "claim-cap-retry-handling"
    type: "capability"
    wording: "A failed evaluation moves the learner to NEEDS_RETRY and allows resubmission as a new attempt without losing history."
    usage_locations:
      - "submission/application.md"
      - "submission/pitch-deck.md"
      - "submission/demo-contingency.md"
    status: "current"
    owner: "member-2"
    evidence:
      automated_tests:
        - "services/api/tests/application/test_process_submission.py"
        - "services/api/tests/application/test_outcome_lookup.py"
      preview_checks:
        - "Verify the attempt counter increments on retry and the first attempt is retained."

  - id: "claim-cap-skills-projection"
    type: "capability"
    wording: "Skills evidence is a direct projection of passed deterministic checks."
    usage_locations:
      - "submission/application.md"
      - "submission/pitch-deck.md"
    status: "current"
    owner: "member-2"
    evidence:
      automated_tests:
        - "services/api/tests/domain/test_skill_evidence.py"
      preview_checks:
        - "Verify skill aggregation returns only competencies backed by recorded evaluation evidence."

  - id: "claim-cap-deterministic-eval"
    type: "capability"
    wording: "The clean-sales evaluator grades CSV and XLSX uploads with four deterministic 25-point checks; a submission passes only with score >= 75 and the critical unique_orders check passed."
    usage_locations:
      - "README.md"
      - "demo/README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
      - "submission/demo-script.md"
    status: "current"
    owner: "member-4"
    evidence:
      automated_tests:
        - "services/api/tests/evaluation/test_sales_cleaning.py"
        - "services/api/tests/evaluation/test_sales_cleaning_boundaries.py"
        - "services/api/tests/evaluation/test_reproducibility.py"
        - "tools/quality/tests/test_demo_kit.py"
      artifacts:
        - "task_packages/clean-sales/1/task.json"
      preview_checks:
        - "Upload demo/files/sales_retry_duplicates.csv and verify 75/100 with passed=false because unique_orders failed."

  - id: "claim-cap-safe-ingestion"
    type: "capability"
    wording: "Uploads are inspected by signature before parsing; unsupported, oversized, macro, multi-sheet and malformed files are rejected with a coded, bilingual reason."
    usage_locations:
      - "README.md"
      - "submission/application.md"
    status: "current"
    owner: "member-4"
    evidence:
      automated_tests:
        - "services/api/tests/evaluation/test_artifact_validation.py"
        - "tools/quality/tests/test_demo_kit.py"
      preview_checks:
        - "Upload demo/files/sales_rejected_missing_columns.csv and verify the missing_columns rejection."

  - id: "claim-cap-bilingual-task"
    type: "capability"
    wording: "The clean-sales task brief and hints are published in Egyptian Arabic and English, pinned by SHA-256 so graded content cannot drift."
    usage_locations:
      - "README.md"
      - "submission/application.md"
    status: "current"
    owner: "member-4"
    evidence:
      automated_tests:
        - "services/api/tests/evaluation/test_task_package.py"
      artifacts:
        - "task_packages/clean-sales/1/content/brief.ar-EG.md"
        - "task_packages/clean-sales/1/content/brief.en.md"
        - "task_packages/clean-sales/1/content/hints.ar-EG.md"
        - "task_packages/clean-sales/1/content/hints.en.md"
      preview_checks:
        - "Open the task in each language and compare the brief with the pinned file."

  - id: "claim-cap-demo-kit"
    type: "capability"
    wording: "The presenter kit holds five reproducible uploads whose scores (100 CSV, 100 XLSX, 75 retry, 50 retry, rejected) are asserted against the real evaluator."
    usage_locations:
      - "demo/README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
      - "submission/demo-script.md"
      - "submission/demo-contingency.md"
      - "docs/operations/demo-runbook.md"
    status: "current"
    owner: "member-1"
    evidence:
      automated_tests:
        - "tools/quality/tests/test_demo_kit.py"
      artifacts:
        - "demo/generate_demo_files.py"
        - "demo/files/sales_cleaned.csv"
        - "demo/files/sales_cleaned.xlsx"
        - "demo/files/sales_retry_duplicates.csv"
        - "demo/files/sales_retry_half.xlsx"
        - "demo/files/sales_rejected_missing_columns.csv"
      preview_checks:
        - "Run uv run --project services/api pytest tools/quality/tests/test_demo_kit.py."

  - id: "claim-cap-secret-hygiene"
    type: "capability"
    wording: "Every commit is scanned by detect-secrets in pre-commit and gitleaks in CI, and the feedback layer never logs secrets."
    usage_locations:
      - "README.md"
      - "submission/application.md"
    status: "current"
    owner: "member-1"
    evidence:
      automated_tests:
        - "services/api/tests/feedback/test_no_secret_logs.py"
      artifacts:
        - ".pre-commit-config.yaml"
        - ".secrets.baseline"
        - ".github/workflows/secret-scan.yml"
      preview_checks:
        - "Verify the Secret scan check is green on the release candidate commit."

  - id: "claim-cap-arabic-feedback"
    type: "capability"
    wording: "Tarek explains each deterministic result in Egyptian Arabic or English, using Gemini when configured and a deterministic fallback otherwise; feedback never changes the grade."
    usage_locations:
      - "README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
      - "submission/demo-script.md"
      - "submission/demo-contingency.md"
    status: "current"
    owner: "member-3"
    evidence:
      automated_tests:
        - "services/api/tests/feedback/test_gemini.py"
        - "services/api/tests/feedback/test_fallback.py"
        - "services/api/tests/feedback/test_service.py"
        - "services/api/tests/evaluation/test_feedback_boundary.py"
      preview_checks:
        - "Run with FEEDBACK_MODE=fallback and verify bilingual Tarek feedback is shown for a retry."

  - id: "claim-cap-web-experience"
    type: "capability"
    wording: "A bilingual Next.js web app (Arabic RTL and English) lets a learner complete all three tasks, download source data, submit a file or text answer, and see task-specific scores, feedback and progress."
    usage_locations:
      - "README.md"
      - "submission/application.md"
      - "submission/pitch-deck.md"
      - "submission/demo-script.md"
    status: "current"
    owner: "member-5"
    evidence:
      automated_tests:
        - "apps/web/tests/e2e/demo-flow.spec.ts"
        - "apps/web/tests/e2e/three-tasks.spec.ts"
        - "services/api/tests/transport/test_journey.py"
      preview_checks:
        - "Complete all three tasks in Arabic and English, then reload and reopen saved results."

  - id: "claim-cap-local-demo"
    type: "capability"
    wording: "demo/run_local.sh starts the API and web app locally with one command and no secrets."
    usage_locations:
      - "README.md"
      - "demo/README.md"
      - "submission/application.md"
      - "docs/operations/demo-runbook.md"
    status: "pending"
    pending_reason: "The integrated launcher passed all three manual health checks; an automated CI smoke test for the script remains to be added."
    owner: "member-1"
    evidence:
      automated_tests: []
      preview_checks:
        - "Run demo/run_local.sh and curl /api/v1/health on the API and through the web proxy."

  - id: "claim-cap-sql-sandbox"
    type: "capability"
    wording: "A bounded, read-only SQLite evaluator grades SQL sales reports against the published source and a modified validation dataset."
    usage_locations:
      - "submission/pitch-deck.md"
    status: "current"
    owner: "member-4"
    evidence:
      automated_tests:
        - "services/api/tests/evaluation/test_sql_report.py"
        - "apps/web/tests/e2e/three-tasks.spec.ts"
      preview_checks:
        - "Submit a valid report and a hard-coded no-op read through the hosted web app."

  - id: "claim-cap-client-email"
    type: "capability"
    wording: "A deterministic case-based rubric grades a bilingual customer update email for recipient, case facts, refund and response commitments, and professional closing."
    usage_locations:
      - "README.md"
    status: "current"
    owner: "member-5"
    evidence:
      automated_tests:
        - "services/api/tests/evaluation/test_client_email.py"
        - "apps/web/tests/e2e/three-tasks.spec.ts"
      preview_checks:
        - "Submit complete and negated-commitment emails in both languages through the hosted web app."
