name: Artifact retention cleanup

# Manual only. This job targets the Supabase Storage bucket and REST/RPC
# retention design in docs/operations/data-retention.md. The hosted demo does
# not use that design: it stores uploads as bytea in the yom_awel Postgres
# schema, so this job has nothing to purge there. The former daily trigger,
# cron: "17 3 * * *", is intentionally removed; do not re-enable it for the demo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retention-cleanup
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v7 compatible immutable SHA
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run bounded retention cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: uv run --project services/api python services/api/scripts/purge_expired_artifacts.py --cleanup-queue
