name: Member 5 experience
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --project services/api --locked
      - run: uv run --project services/api python services/api/scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/openapi.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run api:check && npm run lint && npm run typecheck && npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-evidence
          path: apps/web/test-results
