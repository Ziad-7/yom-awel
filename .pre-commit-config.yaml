repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: Secret scan (detect-secrets)
        entry: uv run --project services/api detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: (^|/)(uv\.lock|package-lock\.json|\.secrets\.baseline)$
      - id: ruff-format
        name: Ruff format check
        entry: uv run --project services/api ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-lint
        name: Ruff lint
        entry: uv run --project services/api ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: strict mypy
        entry: uv run --project services/api mypy --config-file services/api/pyproject.toml services/api/src/yom_awel
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy-tools-demo
        name: strict mypy (tools/quality and demo)
        entry: uv run --project services/api mypy --config-file services/api/pyproject.toml --explicit-package-bases tools/quality demo
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: full pytest
        entry: uv run --project services/api pytest
        language: system
        types_or: [python, pyi]
        pass_filenames: false
